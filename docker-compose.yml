name: trumpstockalert

services:
  api:
    build:
      context: ./backend
    container_name: trump-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=trumpstockalert;Username=trumpuser;Password=${DB_PASSWORD}
      Scheduler__ApiKey: ${SCHEDULER_API_KEY:-}
      Analyzer__Provider: ${ANALYZER_PROVIDER:-Mock}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-5.1-mini}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-30}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://100.92.230.97:5173,http://localhost:5173}
      Collector__TruthSocialAccountId: ${TRUTH_SOCIAL_ACCOUNT_ID:-}
      MAX_POSTS: ${COLLECTOR_MAX_POSTS:-10}
      Collector__MaxPosts: ${COLLECTOR_MAX_POSTS:-5}
    ports:
      - "100.92.230.97:8080:8080"

  postgres:
    image: postgres:17
    container_name: trump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trumpstockalert
      POSTGRES_USER: trumpuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collector:
    build:
      context: ./collector
    restart: "no"
    depends_on:
      - api
    environment:
      COLLECTOR_CLIENT_MODE: playwright
      COLLECTOR_HEADLESS: ${COLLECTOR_HEADLESS:-true}
      COLLECTOR_STORE_MODE: api
      TRUTH_POST_API_BASE_URL: http://api:8080
      TRUTH_SOCIAL_USERNAME: ${TRUTH_SOCIAL_USERNAME:-realDonaldTrump}
      MAX_POSTS: ${COLLECTOR_MAX_POSTS:-10}
      LOOKBACK_MINUTES: ${COLLECTOR_LOOKBACK_MINUTES:-5}
      OUTPUT_MODE: console
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
    command: ["python", "-m", "collector.main", "--skip-lookback"]

  collector-scheduler:
    build:
      context: ./collector-scheduler
    container_name: trump-collector-scheduler
    restart: unless-stopped
    depends_on:
      - api
    environment:
      COLLECTOR_SCHEDULER_ENABLED: ${COLLECTOR_SCHEDULER_ENABLED:-true}
      COLLECTOR_SCHEDULER_URL: ${COLLECTOR_SCHEDULER_URL:-http://api:8080/api/collector/run}
      COLLECTOR_SCHEDULER_INTERVAL_SECONDS: ${COLLECTOR_SCHEDULER_INTERVAL_SECONDS:-900}
      COLLECTOR_SCHEDULER_JITTER_SECONDS: ${COLLECTOR_SCHEDULER_JITTER_SECONDS:-300}
      COLLECTOR_SCHEDULER_BACKOFF_SECONDS: ${COLLECTOR_SCHEDULER_BACKOFF_SECONDS:-1800}
      COLLECTOR_SCHEDULER_HEALTH_URL: ${COLLECTOR_SCHEDULER_HEALTH_URL:-http://api:8080/health}
      COLLECTOR_SCHEDULER_ANALYSIS_ENABLED: ${COLLECTOR_SCHEDULER_ANALYSIS_ENABLED:-true}
      COLLECTOR_SCHEDULER_ANALYSIS_URL: ${COLLECTOR_SCHEDULER_ANALYSIS_URL:-http://api:8080/api/analyses/run}
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    working_dir: /workspace

volumes:
  postgres_data:
