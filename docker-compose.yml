services:
  api:
    build:
      context: ./backend
    container_name: trump-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=trumpstockalert;Username=trumpuser;Password=${DB_PASSWORD}
      Scheduler__ApiKey: ${SCHEDULER_API_KEY:-}
    ports:
      - "100.92.230.97:8080:8080"

  postgres:
    image: postgres:17
    container_name: trump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trumpstockalert
      POSTGRES_USER: trumpuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collector:
    build:
      context: ./collector
    container_name: trump-collector
    restart: "no"
    depends_on:
      - api
    environment:
      COLLECTOR_STORE_MODE: api
      TRUTH_POST_API_BASE_URL: http://api:8080
      TRUTH_SOCIAL_USERNAME: ${TRUTH_SOCIAL_USERNAME:-realDonaldTrump}
      MAX_POSTS: ${COLLECTOR_MAX_POSTS:-10}
      LOOKBACK_MINUTES: ${COLLECTOR_LOOKBACK_MINUTES:-5}
      OUTPUT_MODE: console
      TRUTHSOCIAL_USERNAME: broderfetto
      TRUTHSOCIAL_PASSWORD: snus4860T!
    command: ["python", "-m", "collector.main", "--skip-lookback"]

volumes:
  postgres_data:
