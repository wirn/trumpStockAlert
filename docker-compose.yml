name: trumpstockalert

services:
  api:
    build:
      context: ./backend
    container_name: trump-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=trumpstockalert;Username=trumpuser;Password=${DB_PASSWORD}
      Scheduler__ApiKey: ${SCHEDULER_API_KEY:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://100.92.230.97:5173,http://localhost:5173}
      Collector__TruthSocialAccountId: ${TRUTH_SOCIAL_ACCOUNT_ID:-}
    ports:
      - "100.92.230.97:8080:8080"

  postgres:
    image: postgres:17
    container_name: trump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trumpstockalert
      POSTGRES_USER: trumpuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collector:
    build:
      context: ./collector
    restart: "no"
    depends_on:
      - api
    environment:
      COLLECTOR_CLIENT_MODE: playwright
      COLLECTOR_STORE_MODE: api
      TRUTH_POST_API_BASE_URL: http://api:8080
      TRUTH_SOCIAL_USERNAME: ${TRUTH_SOCIAL_USERNAME:-realDonaldTrump}
      MAX_POSTS: ${COLLECTOR_MAX_POSTS:-10}
      LOOKBACK_MINUTES: ${COLLECTOR_LOOKBACK_MINUTES:-5}
      OUTPUT_MODE: console
    command: ["python", "-m", "collector.main", "--skip-lookback"]

  collector-scheduler:
    build:
      context: ./collector-scheduler
    container_name: trump-collector-scheduler
    restart: unless-stopped
    depends_on:
      - api
    environment:
      COLLECTOR_SCHEDULER_ENABLED: ${COLLECTOR_SCHEDULER_ENABLED:-true}
      COLLECTOR_SCHEDULER_INTERVAL_SECONDS: ${COLLECTOR_SCHEDULER_INTERVAL_SECONDS:-300}
      COLLECTOR_SCHEDULER_JITTER_SECONDS: ${COLLECTOR_SCHEDULER_JITTER_SECONDS:-120}
      COLLECTOR_SCHEDULER_BACKOFF_SECONDS: ${COLLECTOR_SCHEDULER_BACKOFF_SECONDS:-900}
      COLLECTOR_SCHEDULER_HEALTH_URL: ${COLLECTOR_SCHEDULER_HEALTH_URL:-http://api:8080/health}
    volumes:
      # Grants access to the Docker daemon so the scheduler can run:
      #   docker compose run --rm --build collector
      # WARNING: Docker socket access is equivalent to root on the host.
      # Acceptable for a self-hosted home server; review before exposing externally.
      - /var/run/docker.sock:/var/run/docker.sock
      # Project directory mounted read-only so `docker compose` can read
      # docker-compose.yml and .env for variable substitution.
      - .:/workspace:ro
    working_dir: /workspace

volumes:
  postgres_data:
